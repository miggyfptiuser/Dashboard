<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deliverables Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── carbon-copy palette ───────────────────────────────────────────── */
:root{
  --desk:#DAD8D0;
  --paper:#F8F7F3;
  --copy-2:#F1ECDC;
  --copy-3:#EFE3E0;
  --ink:#232120;
  --ink-soft:#6A645C;
  --ink-faint:#9C958A;
  --rule:#D3CDBE;
  --rule-hard:#B4AC9A;
  --stamp-red:#9B2C3A;
  --stamp-blue:#3A4C86;
  --jade:#1D6B54;
  --amber:#A8720C;

  --gap:14px;
  --radius:2px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--desk);
  color:var(--ink);
  font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;
  padding:20px 16px 80px;
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.012) 3px 4px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--stamp-blue);outline-offset:2px}

.wrap{max-width:940px;margin:0 auto}

/* ── the form sheet ────────────────────────────────────────────────── */
.sheet{
  background:var(--paper);
  border:1px solid var(--rule-hard);
  border-radius:var(--radius);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 6px 18px -10px rgba(35,33,32,.4);
}

/* ── masthead ──────────────────────────────────────────────────────── */
.masthead{padding:18px 20px 14px;border-bottom:2px solid var(--ink)}
.mast-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px}
.mast-title{
  font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(20px,4vw,27px);
  letter-spacing:-.02em;text-transform:uppercase;line-height:1.05;
}
.mast-sub{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-soft);
}
.mast-meta{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0}
.who{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft)}
.linkbtn{font-size:12px;color:var(--stamp-red);text-decoration:underline;text-underline-offset:2px}

/* perforation strip under masthead */
.perf{
  height:7px;
  background:
    linear-gradient(90deg,var(--paper) 33.3%,var(--copy-2) 33.3% 66.6%,var(--copy-3) 66.6%);
  border-bottom:1px solid var(--rule);
}

/* ── toolbar ───────────────────────────────────────────────────────── */
.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:11px 20px;border-bottom:1px solid var(--rule);background:var(--copy-2);
}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;padding:5px 10px;border:1px solid var(--rule-hard);
  background:var(--paper);border-radius:var(--radius);color:var(--ink-soft);
  transition:background .12s,color .12s,border-color .12s;
}
.chip:hover{border-color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{
  flex:1;min-width:140px;padding:6px 9px;border:1px solid var(--rule-hard);
  background:var(--paper);border-radius:var(--radius);font-size:13px;
}
.tool-right{margin-left:auto;display:flex;gap:8px}
.btn{
  font-family:Archivo,sans-serif;font-weight:600;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;padding:7px 13px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);border-radius:var(--radius);
}
.btn:hover{background:#3a3734}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.ghost:hover{background:var(--copy-3)}

/* ── deadline strip ────────────────────────────────────────────────── */
.deadlines{padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--copy-3)}
.deadlines h2{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;font-weight:500;
}
.dl-list{display:flex;flex-wrap:wrap;gap:7px}
.dl{
  display:flex;align-items:center;gap:8px;font-size:13px;
  background:var(--paper);border:1px solid var(--rule-hard);
  border-left:3px solid var(--amber);padding:5px 10px;border-radius:var(--radius);
}
.dl.overdue{border-left-color:var(--stamp-red)}
.dl .d{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap}

/* ── sections ──────────────────────────────────────────────────────── */
.section{border-bottom:1px solid var(--rule)}
.section:last-child{border-bottom:none}
.sec-head{
  display:flex;align-items:center;width:100%;
  padding-right:14px;background:var(--paper);
}
.sec-head:hover{background:var(--copy-2)}
.sec-toggle{
  display:flex;align-items:center;gap:11px;flex:1;min-width:0;text-align:left;
  padding:11px 0 11px 20px;
}
.sec-edit{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);padding:5px 7px;flex-shrink:0;
  border:1px solid transparent;border-radius:var(--radius);
}
.sec-edit:hover{color:var(--ink);border-color:var(--rule-hard);background:var(--paper)}
.sec-move{
  font-size:12px;color:var(--ink-faint);padding:4px 6px;line-height:1;
}
.sec-move:hover{color:var(--ink)}
.sec-move[disabled]{opacity:.3;cursor:default}

/* section editor sits inside the section, above its rows */
.sec-editor{padding:14px 20px 16px;background:var(--copy-3);border-top:1px solid var(--rule)}
.danger{
  margin-top:12px;padding:11px 13px;background:var(--paper);
  border:1px solid var(--stamp-red);border-radius:var(--radius);
}
.danger h4{
  font-family:Archivo,sans-serif;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--stamp-red);margin-bottom:6px;
}
.danger p{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:9px}
.danger .row-inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.danger-btn{background:var(--stamp-red);border-color:var(--stamp-red)}
.btn.danger-btn:hover{background:#7d232e}

/* new-section footer */
.sec-new{padding:13px 20px;background:var(--copy-2);border-top:1px solid var(--rule)}
/* the tri-colour carbon tab encodes the section kind */
.tab{width:5px;height:19px;flex-shrink:0;background:var(--rule-hard)}
.tab[data-kind="deliverables"]{background:var(--ink)}
.tab[data-kind="issue_logs"]{background:var(--stamp-red)}
.tab[data-kind="content_tags"]{background:var(--stamp-blue)}
.tab[data-kind="migration"]{background:var(--jade)}
.tab[data-kind="recurring"]{background:var(--amber)}
.sec-label{
  font-family:Archivo,sans-serif;font-weight:600;font-size:14px;letter-spacing:.02em;
  text-transform:uppercase;
}
.sec-count{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);
  margin-left:auto;
}
.caret{font-size:10px;color:var(--ink-faint);transition:transform .15s}
.section[data-open="false"] .caret{transform:rotate(-90deg)}
.section[data-open="false"] .sec-body{display:none}

/* ── item rows ─────────────────────────────────────────────────────── */
.row{
  display:flex;gap:11px;padding:10px 20px 10px 20px;
  border-top:1px dotted var(--rule);align-items:flex-start;
}
.row:hover{background:var(--copy-2)}
.row.sub{padding-left:46px;background:rgba(0,0,0,.012)}
.row.sub:hover{background:var(--copy-2)}
.row.done .title{color:var(--ink-faint);text-decoration:line-through}
.row.done .detail{color:var(--ink-faint)}

.tick{
  width:16px;height:16px;flex-shrink:0;margin-top:3px;
  border:1.5px solid var(--rule-hard);border-radius:var(--radius);background:var(--paper);
  display:grid;place-items:center;font-size:11px;line-height:1;color:transparent;
}
.tick:hover{border-color:var(--ink-soft)}
.row.done .tick{background:var(--jade);border-color:var(--jade);color:#fff}

.body{flex:1;min-width:0}
.title-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 9px}
.title{font-weight:500;font-size:14.5px;cursor:pointer}
.title:hover{text-decoration:underline;text-underline-offset:2px;text-decoration-style:dotted}
.detail{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
.trace{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.03em;
  color:var(--ink-faint);margin-top:4px;
}
.ref{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--stamp-red);
}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;
  padding:1px 5px;border:1px solid var(--rule-hard);color:var(--ink-soft);
  border-radius:var(--radius);background:var(--paper);
}
.urgent{
  font-family:Archivo,sans-serif;font-weight:700;font-size:10px;letter-spacing:.1em;
  color:var(--stamp-red);border:1px solid var(--stamp-red);padding:1px 5px;
}

.meta{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:1px}
.owner{
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.04em;
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--copy-3);border:1px solid var(--rule-hard);color:var(--ink-soft);
}
.owner.none{color:var(--ink-faint);font-weight:400}

/* the signature: rubber-stamp status */
.stamp{
  font-family:Archivo,sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;padding:3px 7px;border:1.5px solid currentColor;
  border-radius:var(--radius);white-space:nowrap;opacity:.88;
  color:var(--ink-soft);
}
.stamp[data-s="in_progress"],.stamp[data-s="sit"],.stamp[data-s="uat"]{color:var(--stamp-blue)}
.stamp[data-s="for_checking"],.stamp[data-s="for_addressing"],
.stamp[data-s="for_validation"],.stamp[data-s="for_enhancement"]{color:var(--stamp-red)}
.stamp[data-s="for_deployment"]{color:var(--amber)}
.stamp[data-s="live"]{color:var(--jade);transform:rotate(-2.5deg);box-shadow:0 0 0 2px var(--paper)}
.stamp[data-s="done"]{color:var(--jade);transform:rotate(-2.5deg)}
.stamp[data-s="tbs"]{color:var(--ink-faint);border-style:dashed}

/* pipeline rail — only for items actually on the deploy track */
.rail{display:flex;gap:2px;margin-top:6px;max-width:290px}
.seg{flex:1;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:9px;
  letter-spacing:.08em;padding:2px 0;border:1px solid var(--rule);color:var(--ink-faint);
  background:var(--paper);border-radius:1px}
.seg.on{background:var(--stamp-blue);border-color:var(--stamp-blue);color:#fff}
.seg.on.final{background:var(--jade);border-color:var(--jade)}

/* ── team roster ───────────────────────────────────────────────────── */
.team{padding:14px 20px 16px;background:var(--copy-3);border-bottom:1px solid var(--rule)}
.team-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.team-head h2{
  font-family:Archivo,sans-serif;font-weight:600;font-size:13px;letter-spacing:.05em;
  text-transform:uppercase;
}
.team-note{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft)}
.team-list{background:var(--paper);border:1px solid var(--rule-hard);border-radius:var(--radius)}
.team-row{
  display:flex;align-items:center;gap:11px;padding:9px 12px;
  border-bottom:1px dotted var(--rule);
}
.team-row:last-child{border-bottom:none}
.team-body{flex:1;min-width:0}
.team-name{font-weight:500;font-size:14px}
.team-you{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--rule-hard);
  padding:0 4px;border-radius:var(--radius);
}
.team-sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.link-state{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-faint);border:1px dashed var(--rule-hard);
  padding:2px 6px;border-radius:var(--radius);white-space:nowrap;
}
.link-state.on{color:var(--jade);border-style:solid;border-color:var(--jade)}
.team-editor{padding:12px;border-bottom:1px dotted var(--rule);background:var(--copy-2)}
.team-editor:last-child{border-bottom:none}

/* ── editor ────────────────────────────────────────────────────────── */
.editor{padding:14px 20px 16px;background:var(--copy-2);border-top:1px dotted var(--rule)}
.editor.sub{padding-left:46px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field.wide{grid-column:1/-1}
.field label{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);
}
.field input,.field select,.field textarea{
  padding:6px 8px;border:1px solid var(--rule-hard);background:var(--paper);
  border-radius:var(--radius);font-size:13.5px;width:100%;
}
.field textarea{resize:vertical;min-height:52px;font-family:inherit}
.check{flex-direction:row;align-items:center;gap:7px}
.check input{width:auto}
.ed-actions{display:flex;gap:8px;margin-top:12px;align-items:center}
.del{margin-left:auto;font-size:12px;color:var(--stamp-red);text-decoration:underline;text-underline-offset:2px}

/* ── auth / setup ──────────────────────────────────────────────────── */
.gate{max-width:430px;margin:9vh auto;padding:30px 28px}
.gate h1{font-family:Archivo,sans-serif;font-weight:700;font-size:21px;
  text-transform:uppercase;letter-spacing:-.01em;margin-bottom:6px}
.gate p{font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;line-height:1.55}
.gate input{width:100%;padding:9px 11px;border:1px solid var(--rule-hard);
  background:var(--paper);border-radius:var(--radius);margin-bottom:10px}
.gate .btn{width:100%;padding:10px}
.note{font-size:12.5px;margin-top:14px;padding:10px 12px;background:var(--copy-3);
  border-left:3px solid var(--stamp-red);line-height:1.5}
code{font-family:"IBM Plex Mono",monospace;font-size:.9em;background:var(--copy-3);
  padding:1px 4px;border-radius:2px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:var(--radius);
  font-size:13px;z-index:50;box-shadow:0 6px 20px -8px rgba(0,0,0,.5);
}
.empty{padding:26px 20px;text-align:center;color:var(--ink-faint);font-size:13.5px}

/* ── view tabs (Board / Dashboard) ─────────────────────────────────── */
.view-tabs{
  display:flex;gap:0;padding:0 20px;background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.view-tab{
  font-family:Archivo,sans-serif;font-weight:600;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;padding:11px 18px 10px;color:var(--ink-faint);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.view-tab:hover{color:var(--ink-soft)}
.view-tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* ── dashboard ─────────────────────────────────────────────────────── */
.dash-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:var(--gap);padding:16px 20px 20px;background:var(--copy-2);
}
.dash-card{
  background:var(--paper);border:1px solid var(--rule-hard);
  border-radius:var(--radius);padding:14px 16px;
}
.dash-title{
  font-family:Archivo,sans-serif;font-weight:600;font-size:13px;letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--rule);
}
.dash-sub{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;
}
.dash-split{display:flex;gap:16px;flex-wrap:wrap}
.dash-col{flex:1;min-width:130px}
.dash-list{display:flex;flex-direction:column}
.dash-row{
  display:flex;align-items:center;gap:10px;padding:6px 0;
  border-top:1px dotted var(--rule);font-size:13px;
}
.dash-row:first-child{border-top:none}
.dash-row-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-row-num{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  color:var(--ink-soft);min-width:22px;text-align:right;
}
.dash-row-when{
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);
  white-space:nowrap;
}
.dash-row-item{color:var(--ink-soft)}
.dash-row .owner{width:22px;height:22px;font-size:9.5px}
.dash-dot{
  width:8px;height:8px;flex-shrink:0;border-radius:50%;background:var(--ink-soft);
}
.dash-dot[data-s="in_progress"]{background:var(--stamp-blue)}
.dash-dot[data-s="for_checking"],
.dash-dot[data-s="for_addressing"],
.dash-dot[data-s="for_validation"],
.dash-dot[data-s="for_enhancement"]{background:var(--stamp-red)}
.dash-dot[data-s="for_deployment"]{background:var(--amber)}
.dash-dot[data-s="done"]{background:var(--jade)}
.dash-dot[data-s="tbs"]{background:var(--ink-faint)}
.dash-tiles{display:flex;gap:8px}
.dash-tile{
  flex:1;text-align:center;padding:10px 8px;
  background:var(--copy-3);border:1px solid var(--rule);border-radius:var(--radius);
}
.dash-stat{
  font-family:Archivo,sans-serif;font-weight:700;font-size:26px;line-height:1;
  color:var(--ink);
}
.dash-stat.alert{color:var(--stamp-red)}
.dash-tile-label{
  font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);margin-top:5px;
}

@media (max-width:620px){
  body{padding:10px 8px 60px}
  .masthead,.toolbar,.deadlines,.row,.editor,.sec-editor,.sec-new,.team,.view-tabs,.dash-grid{padding-left:13px;padding-right:13px}
  .sec-toggle{padding-left:13px}
  .sec-head{padding-right:8px}
  .row.sub,.editor.sub{padding-left:32px}
  .mast-meta{margin-left:0;width:100%}
  .meta{flex-direction:column;align-items:flex-end;gap:5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ═══════════════════════════════════════════════════════════════════
   CONFIG — replace these two values, then commit.
   Both are safe to make public: the anon key only works for users you
   have invited, because Row Level Security requires a members row.
   ═══════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://vrdnyddivmvzoccbgauz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ZUzHUdx5ymaWCAfNBVQ1kQ_4AP6nIXE';
const BOARD_NAME = 'HTLAND Deliverables';

/* ── status vocabulary ─────────────────────────────────────────────── */
const STATUS = {
  nys:             { label:'NYS',            viber:'NYS' },
  in_progress:     { label:'In Progress',    viber:'ongoing' },
  for_checking:    { label:'For Checking',   viber:'for checking' },
  for_addressing:  { label:'For Addressing', viber:'for addressing' },
  for_validation:  { label:'For Validation', viber:'for validation' },
  for_enhancement: { label:'For Enhancement',viber:'for enhancement' },
  for_deployment:  { label:'For Deployment', viber:'for deployment' },
  sit:             { label:'SIT',            viber:'in SIT' },
  uat:             { label:'UAT',            viber:'in UAT' },
  live:            { label:'LIVE',           viber:'deployed in LIVE' },
  done:            { label:'Done',           viber:'DONE' },
  tbs:             { label:'TBS',            viber:'TBS' },
};
const PIPELINE = ['sit','uat','live'];
// statuses still offered in the editor — sit/uat/live moved to `stage`
const PICKABLE = ['nys','in_progress','for_checking','for_addressing',
                  'for_validation','for_enhancement','for_deployment','done','tbs'];

/* Section kinds. The kind drives the colour of the tab and the header style
   used by the Viber export — 'deliverables' is the unlabelled numbered list,
   everything else gets its own *Heading:* line. */
const KINDS = {
  deliverables:  'Deliverables (numbered, no heading)',
  issue_logs:    'Issue logs',
  content_tags:  'Content tags',
  migration:     'Migration activities',
  recurring:     'Recurring tasks',
  deadlines:     'Deadlines',
};

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const root = document.getElementById('root');
const state = { me:null, members:[], sections:[], items:[], activity:new Map(),
                activityFeed:[],
                editing:null,
                editingSince:null,
                pending:null,
                editingSection:null, confirmingDelete:null,
                showTeam:false, editingMember:null,
                view:'board',
                filterOwner:'all', filterStatus:'all', q:'', collapsed:new Set() };

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'section';

/* ── helpers ───────────────────────────────────────────────────────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d+'T00:00:00').toLocaleDateString('en-US',
  { month:'short', day:'numeric' });

// Editors are uncontrolled — typed values live only in the DOM until save
// (see CLAUDE.md). Repainting mid-edit would erase them, so realtime handlers
// keep state fresh but hold the render until the editor closes.
const isEditing = () =>
  state.editing != null || state.editingSection != null || state.editingMember != null;

const stopEditing = () => {
  state.editing = null;
  state.editingSince = null;
  state.pending = null;
};

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function updatedAs(){
  if(!state.items.length) return '';
  const latest = state.items.reduce((a,b) =>
    new Date(a.updated_at) > new Date(b.updated_at) ? a : b);
  return new Date(latest.updated_at).toLocaleTimeString('en-US',
    { hour:'numeric', minute:'2-digit' });
}

/* Derived metrics for the Dashboard view. Pure function of state. */
function dashData(){
  const items = state.items;
  const open  = items.filter(i => i.status !== 'done');

  const statusCounts = Object.fromEntries(PICKABLE.map(k => [k, 0]));
  items.forEach(i => {
    if(statusCounts[i.status] !== undefined) statusCounts[i.status]++;
  });

  const workload = state.members.map(m => ({
    member: m,
    openCount: open.filter(i => i.owner_id === m.id).length,
  })).sort((a,b) => b.openCount - a.openCount);

  const pipeline = { sit:0, uat:0, live:0 };
  open.forEach(i => { if(i.stage && pipeline[i.stage] !== undefined) pipeline[i.stage]++; });

  const fd = open.filter(i => i.status === 'for_deployment');
  const forDeployment = {
    total:   fd.length,
    bySit:   fd.filter(i => i.stage === 'sit').length,
    byUat:   fd.filter(i => i.stage === 'uat').length,
    noStage: fd.filter(i => !i.stage).length,
  };

  const t = today();
  const overdue = open.filter(i => i.due_date && i.due_date < t)
    .sort((a,b) => a.due_date.localeCompare(b.due_date));
  const urgentCount = open.filter(i => i.is_urgent).length;

  const weekAgo = Date.now() - 7*24*60*60*1000;
  const agingAll = open
    .filter(i => i.updated_at && new Date(i.updated_at).getTime() < weekAgo)
    .sort((a,b) => new Date(a.updated_at) - new Date(b.updated_at));
  const agingItems = agingAll.slice(0, 10);
  const agingCount = agingAll.length;

  const feed = state.activityFeed.slice(0, 10).map(a => {
    const item = state.items.find(i => i.id === a.item_id);
    const who  = state.members.find(m => m.id === a.actor_id);
    return {
      title: item ? item.title : `Item #${a.item_id}`,
      actor: who ? who.name.split(' ')[0] : 'someone',
      what:  a.action === 'status' ? a.detail : a.action,
      when:  a.at,
    };
  });

  return { statusCounts, workload, pipeline, forDeployment,
           overdue, urgentCount, agingItems, agingCount, feed };
}

/* ═══════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════ */
if (SUPABASE_URL.startsWith('YOUR_')) {
  renderSetup();
} else {
  const { data:{ session } } = await sb.auth.getSession();
  session ? await start() : renderLogin();
  // Supabase re-emits SIGNED_IN on token refresh, tab-focus, and cross-tab
  // sync — not just fresh logins. Re-running start() there would wipe
  // whatever the user is typing (render() isn't editing-guarded) and stack
  // duplicate realtime channels. Only boot when we aren't already signed in.
  sb.auth.onAuthStateChange((e) => {
    if (e === 'SIGNED_OUT') { state.me = null; renderLogin(); return; }
    if (e === 'SIGNED_IN' && !state.me) start();
  });
}

async function start(){
  const { data:{ user } } = await sb.auth.getUser();
  // An invited teammate may already have a member row created before they ever
  // signed in. Link it to their auth account by matching email.
  // Note: rpc() returns a thenable builder, not a Promise — no .catch() on it.
  const { error: claimErr } = await sb.rpc('claim_membership');
  if(claimErr) console.warn('claim_membership:', claimErr.message);

  await loadMembers();
  state.me = state.members.find(m => m.user_id === user.id) || null;
  if(!state.me){ renderNotInvited(user.email); return; }
  await Promise.all([loadSections(), loadItems(), loadActivity()]);
  render();
  sb.channel('board')
    .on('postgres_changes', { event:'*', schema:'public', table:'items' },
      async () => { await loadItems();    if(!isEditing()) render(); })
     .on('postgres_changes', { event:'*', schema:'public', table:'activity' },
      async () => { await loadActivity(); if(!isEditing()) render(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'sections' },
      async () => { await loadSections(); if(!isEditing()) render(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'members' },
      async () => { await loadMembers();  if(!isEditing()) render(); })
    .subscribe();
}

async function loadMembers(){
  const { data } = await sb.from('members').select('*').order('name');
  state.members = data || [];
}

async function loadSections(){
  const { data } = await sb.from('sections').select('*').order('sort_order');
  state.sections = data || [];
}

async function loadItems(){
  const { data } = await sb.from('items').select('*')
    .order('sort_order').order('id');
  state.items = data || [];
}

async function loadActivity(){
  const { data } = await sb.from('activity')
    .select('item_id, actor_id, action, detail, at')
    .order('at', { ascending:false }).limit(300);
  state.activityFeed = data || [];
  state.activity = new Map();
  state.activityFeed.forEach(a => { if(!state.activity.has(a.item_id)) state.activity.set(a.item_id, a); });
}

function ago(ts){
  const s = (Date.now() - new Date(ts)) / 1000;
  if(s < 90) return 'just now';
  if(s < 5400) return `${Math.round(s/60)}m ago`;
  if(s < 172800) return `${Math.round(s/3600)}h ago`;
  return `${Math.round(s/86400)}d ago`;
}

function renderLogin(){
  root.innerHTML = `<div class="sheet gate">

       remember or rotate.</p>

function visible(it){
  if(state.filterOwner === 'mine' && it.owner_id !== state.me.id) return false;
  if(state.filterOwner !== 'all' && state.filterOwner !== 'mine'
     && it.owner_id !== state.filterOwner) return false;
  if(state.filterStatus === 'open' && (it.status === 'done')) return false;
  if(state.filterStatus === 'urgent' && !it.is_urgent) return false;
  if(state.q){
    const hay = [it.title, it.detail, it.ref_code]
      .join(' ').toLowerCase();
    if(!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

        <button class="chip" data-s="urgent" aria-pressed="${state.filterStatus==='urgent'}">Urgent</button>

function renderTeam(){
  const pending = state.members.filter(m => !m.user_id).length;
  return `<div class="team">

      <h2>Team</h2>

      ${state.members.map(m => {
        const load = state.items.filter(i => i.owner_id === m.id && i.status !== 'done').length;

        if(isEd) return renderMemberEditor(m);
        return `<div class="team-row">
          <span class="owner">${esc(m.initials)}</span>

            <div class="team-name">${esc(m.name)}${m.id===state.me.id?' <span class="team-you">you</span>':''}</div>

function renderSection(sec){
  const open = !state.collapsed.has(sec.id);
  const tops = state.items.filter(i => i.section_id === sec.id && !i.parent_id);
  const shown = tops.filter(t => visible(t) ||
    state.items.some(c => c.parent_id === t.id && visible(c)));
  const openCount = tops.filter(t => t.status !== 'done').length;

  const editing = state.editingSection === sec.id;

  return `<section class="section" data-open="${open || editing}" data-id="${sec.id}">
    <div class="sec-head">
      <button class="sec-toggle" data-toggle="${sec.id}">
        <span class="caret">▼</span>
        <span class="tab" data-kind="${sec.kind}"></span>
        <span class="sec-label">${esc(sec.label)}</span>
        <span class="sec-count">${openCount} open / ${tops.length}</span>
      </button>
      <button class="sec-edit" data-secedit="${sec.id}">${editing ? 'Close' : 'Edit'}</button>
    </div>
    ${editing ? renderSectionEditor(sec, tops.length) : ''}
    <div class="sec-body">
      ${shown.length ? shown.map(t => renderItem(t, sec) +
          state.items.filter(c => c.parent_id === t.id)
            .map(c => renderItem(c, sec, true)).join('')).join('')
        : `<div class="empty">Nothing here matches the current filter.</div>`}
      <div class="row" style="border-top:1px dotted var(--rule)">
        <span style="width:16px"></span>
        <button class="linkbtn" data-add="${sec.id}">+ Add item</button>
      </div>
    </div>
  </section>`;
}

function renderItem(it, sec, isSub=false){
  if(state.editing === it.id) return renderEditor(it, isSub);
  const owner = state.members.find(m => m.id === it.owner_id);
  const st = STATUS[it.status];
  const onRail = !!it.stage;

  return `<div class="row ${isSub?'sub':''} ${it.status==='done'?'done':''}" data-id="${it.id}">
    <button class="tick" data-done="${it.id}" aria-label="Toggle done">✓</button>
    <div class="body">
      <div class="title-line">
        ${it.ref_code ? `<span class="ref">#${esc(it.ref_code)}</span>` : ''}
        <span class="title" data-edit="${it.id}">${esc(it.title)}</span>
        ${it.is_urgent ? '<span class="urgent">URGENT</span>' : ''}
        ${(it.sql_objects||[]).length
          ? `<span class="tag" title="${esc(it.sql_objects.join('\n'))}" style="color:var(--jade);border-color:var(--jade)">⚙ ${it.sql_objects.length} SQL</span>`
          : ''}
      </div>
      ${it.detail ? `<div class="detail">${esc(it.detail)}</div>` : ''}
      ${(() => {
        const a = state.activity.get(it.id);
        if(!a) return '';
        const who = state.members.find(m => m.id === a.actor_id);
        return `<div class="trace">${esc(who ? who.name.split(' ')[0] : 'someone')} ·
          ${esc(a.action === 'status' ? a.detail : a.action)} · ${ago(a.at)}</div>`;
      })()}
      ${onRail ? `<div class="rail">${PIPELINE.map((p,i) => {
        const at = PIPELINE.indexOf(it.stage);
        return `<span class="seg ${i<=at?'on':''} ${p==='live'?'final':''}">${p.toUpperCase()}</span>`;
      }).join('')}</div>` : ''}
    </div>
    <div class="meta">
      <span class="stamp" data-s="${it.status}">${st.label}</span>
      <span class="owner ${owner?'':'none'}" title="${owner?esc(owner.name):'Unassigned'}">${owner?esc(owner.initials):'—'}</span>
    </div>
  </div>`;
}

  const idx = state.sections.findIndex(s => s.id === sec.id);
  const total = state.items.filter(i => i.section_id === sec.id).length;
  const others = state.sections.filter(s => s.id !== sec.id);
  const confirming = state.confirmingDelete === sec.id;

  return `<div class="sec-editor">
    <div class="grid">
      <div class="field">
        <label for="s-label">Section name</label>
        <input id="s-label" value="${esc(sec.label)}">
      </div>
      <div class="field">
        <label for="s-kind">Type</label>
        <select id="s-kind">
          ${Object.entries(KINDS).map(([k,v]) =>

      <div class="field">

        <div style="display:flex;gap:6px;align-items:center">

      <button class="btn ghost" data-seccancel="1">Cancel</button>

    </div>

    ${confirming ? `<div class="danger">

        ? `<p>This section is empty, so nothing else is affected.</p>
           <div class="row-inline">
             <button class="btn danger-btn" data-secdelgo="${sec.id}">Delete section</button>
             <button class="btn ghost" data-secdelno="1">Keep it</button>

        : `<p>This section holds <strong>${total} item${total===1?'':'s'}</strong>, including

             <button class="btn ghost" data-secdelno="1">Cancel</button>
           </div>`}
    </div>` : ''}
  </div>`;

/* ═══════════════════════════════════════════════════════════════════
   DEPLOY — SQL-object push queue.
   Item-level: everything an item carries in sql_objects moves together
   at each stage jump. If mixed-stage pushes become a thing, promote the
   array into a child table and add per-object timestamps.
   ═══════════════════════════════════════════════════════════════════ */
function deployData(){
  const q = state.items.filter(i =>
    i.status === 'for_deployment' && (i.sql_objects||[]).length);
  return {
    sitToUat:  q.filter(i => i.stage === 'sit'),
    uatToLive: q.filter(i => i.stage === 'uat'),
    unstaged:  q.filter(i => !i.stage),
  };
}

function renderDeployCard(title, subtitle, bucket, items){
  const totalObjects = items.reduce((n,i) => n + i.sql_objects.length, 0);
  return `<div class="dash-card">
    <h3 class="dash-title" style="display:flex;align-items:center;gap:10px">
      <span style="flex:1">${esc(title)}</span>
      <span class="dash-row-num">${items.length} item${items.length===1?'':'s'} · ${totalObjects} obj</span>
      ${items.length ? `<button class="linkbtn" data-copysql="${bucket}">Copy list</button>` : ''}
    </h3>
    <div class="dash-sub">${esc(subtitle)}</div>
    ${items.length
      ? `<div class="dash-list">${items.map(i => `
          <div style="padding:8px 0;border-top:1px dotted var(--rule)">
            <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
              ${i.ref_code ? `<span class="ref">#${esc(i.ref_code)}</span>` : ''}
              <span style="font-weight:500">${esc(i.title)}</span>
            </div>
            <ul style="list-style:none;padding:6px 0 0 0;margin:0">
              ${i.sql_objects.map(o => {
                const m = o.match(/^([A-Z]+):(.+)$/);
                return `<li style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);padding:2px 0">${
                  m ? `<span class="tag" style="margin-right:6px">${esc(m[1])}</span><code>${esc(m[2].trim())}</code>`
                    : `<code>${esc(o)}</code>`}</li>`;
              }).join('')}
            </ul>
          </div>`).join('')}</div>`
      : `<div class="empty" style="padding:10px 0 0">Nothing here.</div>`}
  </div>`;
}

function renderDeploy(){
  const d = deployData();
  return `<div class="dash-grid">
    ${renderDeployCard('SIT → UAT ready',
        'Items in SIT flagged For Deployment. Push these next to UAT.',
        'sit', d.sitToUat)}
    ${renderDeployCard('UAT → LIVE ready',
        'Items in UAT flagged For Deployment. Push these next to LIVE.',
        'uat', d.uatToLive)}
    ${renderDeployCard('Not staged yet',
        'For Deployment but no stage set — decide where they go first.',
        'unstaged', d.unstaged)}
  </div>`;
}

function copySql(bucket){
  const d = deployData();
  const items = bucket === 'sit' ? d.sitToUat
             : bucket === 'uat' ? d.uatToLive
             : d.unstaged;
  if(!items.length){ toast('Nothing to copy.'); return; }
  const seen = new Set();
  const out = [];
  items.forEach(i => {
    i.sql_objects.forEach(o => {
      const key = o.trim();
      if(key && !seen.has(key)){ seen.add(key); out.push(key); }
    });
  });
  const text = out.join('\n');
  navigator.clipboard.writeText(text)
    .then(() => toast(`Copied ${out.length} object${out.length===1?'':'s'}.`))
    .catch(() => { prompt('Copy this:', text); });
}

/* ═══════════════════════════════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════════════════════════════ */
function wire(){
  document.getElementById('signout').onclick = () => sb.auth.signOut();

  // Tab switch discards any open editor — treated as abandoning the edit.
  root.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    state.view = b.dataset.view;
    stopEditing();
    state.editingSection = null;
    state.editingMember = null;
    state.confirmingDelete = null;
    render();
  });

  root.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    state.filterOwner = b.dataset.o; render(); });
  root.querySelectorAll('.chip[data-s]').forEach(b => b.onclick = () => {
    state.filterStatus = state.filterStatus === b.dataset.s ? 'all' : b.dataset.s; render(); });

  const q = document.getElementById('q');
  if(q){
    q.oninput = () => { state.q = q.value; render();
      const n = document.getElementById('q'); n.focus();
      n.setSelectionRange(n.value.length, n.value.length); };
  }

  document.getElementById('viber').onclick = copyForViber;

  document.getElementById('team').onclick = () => {
    state.showTeam = !state.showTeam; state.editingMember = null; render(); };

  const tClose = document.getElementById('team-close');
  if(tClose) tClose.onclick = () => {
    state.showTeam = false; state.editingMember = null; render(); };

  const mNew = document.getElementById('mem-new');
  if(mNew) mNew.onclick = () => {
    state.editingMember = 'new'; render(); document.getElementById('m-name').focus(); };

  root.querySelectorAll('[data-memedit]').forEach(b => b.onclick = () => {
    state.editingMember = b.dataset.memedit; render(); });

  root.querySelectorAll('[data-memcancel]').forEach(b => b.onclick = () => {
    state.editingMember = null; render(); });

  root.querySelectorAll('[data-memsave]').forEach(b => b.onclick = async () => {
    const id = b.dataset.memsave;
    const name = document.getElementById('m-name').value.trim();
    if(!name){ toast('Give the member a name first.'); return; }
    let initials = document.getElementById('m-initials').value.trim().toUpperCase();
    if(!initials) initials = name.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
    const email = document.getElementById('m-email').value.trim() || null;

    const { error } = id === 'new'
      ? await sb.from('members').insert({ name, initials, email })
      : await sb.from('members').update({ name, initials, email }).eq('id', id);
    if(error){ toast(error.message); return; }
    state.editingMember = null;
    await loadMembers(); render();
  });

  root.querySelectorAll('[data-memdel]').forEach(b => b.onclick = async () => {
    const m = state.members.find(x => x.id === b.dataset.memdel);
    const load = state.items.filter(i => i.owner_id === m.id).length;
    if(!confirm(load
      ? `Remove ${m.name}? Their ${load} assigned item${load===1?'':'s'} stay on the board but become unassigned.`
      : `Remove ${m.name}?`)) return;
    const { error } = await sb.from('members').delete().eq('id', m.id);
    if(error){ toast(error.message); return; }
    state.editingMember = null;
    await loadMembers(); await loadItems(); render();
  });

  root.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const id = +b.dataset.toggle;
    state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
    render();
  });

  /* ── section management ────────────────────────────────────────── */
  root.querySelectorAll('[data-secedit]').forEach(b => b.onclick = () => {
    const id = +b.dataset.secedit;
    state.editingSection = state.editingSection === id ? null : id;
    state.confirmingDelete = null;
    render();
  });

  root.querySelectorAll('[data-seccancel]').forEach(b => b.onclick = () => {
    state.editingSection = null; state.confirmingDelete = null; render(); });

  root.querySelectorAll('[data-secsave]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.secsave;
    const label = document.getElementById('s-label').value.trim();
    if(!label){ toast('Give the section a name first.'); return; }
    const { error } = await sb.from('sections')
      .update({ label, kind: document.getElementById('s-kind').value }).eq('id', id);
    if(error){ toast(error.message); return; }
    state.editingSection = null;
    await loadSections(); render();
  });

  const nOpen = document.getElementById('n-open');
  if(nOpen) nOpen.onclick = () => {
    state.editingSection = 'new'; state.confirmingDelete = null; render();
    document.getElementById('n-label').focus();
  };

  const nSave = document.getElementById('n-save');
  if(nSave) nSave.onclick = async () => {
    const label = document.getElementById('n-label').value.trim();
    if(!label){ toast('Give the section a name first.'); return; }
    let key = slug(label);
    const taken = new Set(state.sections.map(s => s.key));
    if(taken.has(key)){ let n = 2; while(taken.has(`${key}-${n}`)) n++; key = `${key}-${n}`; }
    const { error } = await sb.from('sections').insert({
      key, label,
      kind: document.getElementById('n-kind').value,
      sort_order: state.sections.length + 1,
    });
    if(error){ toast(error.message); return; }
    state.editingSection = null;
    await loadSections(); render();
  };

  root.querySelectorAll('[data-up],[data-down]').forEach(b => b.onclick = async () => {
    const id = +(b.dataset.up || b.dataset.down);
    const dir = b.dataset.up ? -1 : 1;
    const i = state.sections.findIndex(s => s.id === id);
    const j = i + dir;
    if(j < 0 || j >= state.sections.length) return;
    const a = state.sections[i], c = state.sections[j];
    await Promise.all([
      sb.from('sections').update({ sort_order: c.sort_order }).eq('id', a.id),
      sb.from('sections').update({ sort_order: a.sort_order }).eq('id', c.id),
    ]);
    await loadSections(); render();
  });

  root.querySelectorAll('[data-secdel]').forEach(b => b.onclick = () => {
    state.confirmingDelete = +b.dataset.secdel; render(); });

  root.querySelectorAll('[data-secdelno]').forEach(b => b.onclick = () => {
    state.confirmingDelete = null; render(); });

  root.querySelectorAll('[data-secmove]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.secmove;
    const to = +document.getElementById('s-moveto').value;
    const { error: mErr } = await sb.from('items')
      .update({ section_id: to }).eq('section_id', id);
    if(mErr){ toast(mErr.message); return; }
    const { error } = await sb.from('sections').delete().eq('id', id);
    if(error){ toast(error.message); return; }
    state.editingSection = null; state.confirmingDelete = null;
    await loadSections(); await loadItems(); render();
    toast('Items moved, section deleted.');
  });

  root.querySelectorAll('[data-secdelgo]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.secdelgo;
    const { error } = await sb.from('sections').delete().eq('id', id);
    if(error){ toast(error.message); return; }
    state.editingSection = null; state.confirmingDelete = null;
    await loadSections(); await loadItems(); render();
    toast('Section deleted.');
  });

  root.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
    const it = state.items.find(i => i.id === +b.dataset.done);
    const { error } = await sb.from('items').update({ status: it.status === 'done' ? 'nys' : 'done' })
      .eq('id', it.id);
    if(error){ toast(error.message); return; }
    await loadItems(); render();
  });

  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const id = +b.dataset.edit;
    const it = state.items.find(i => i.id === id);
    state.editing = id;
    state.editingSince = it ? it.updated_at : null;
    render();
  });

  root.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    state.pending = { section_id:+b.dataset.add, parent_id:null };
    state.editing = 'new'; renderNewInto(+b.dataset.add, null); });

  root.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => {
    const p = state.items.find(i => i.id === +b.dataset.sub);
    state.pending = { section_id:p.section_id, parent_id:p.id };
    state.editing = 'new'; renderNewInto(p.section_id, p.id); });

  root.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    stopEditing(); render(); });

  root.querySelectorAll('[data-save]').forEach(b => b.onclick = () => save(b.dataset.save));

  root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Delete this item and any sub-items?')) return;
    const { error } = await sb.from('items').delete().eq('id', +b.dataset.del);
    if(error){ toast(error.message); return; }
    stopEditing(); await loadItems(); render();
  });

  root.querySelectorAll('[data-copysql]').forEach(b => b.onclick = () => copySql(b.dataset.copysql));
}

function renderNewInto(sectionId, parentId){
  const blank = { id:'new', title:'', detail:'', owner_id:state.me.id,
                  status:'nys', ref_code:'', sql_objects:[],
                  due_date:null, is_urgent:false, parent_id:parentId };
  render();
  const sec = root.querySelector(`.section[data-id="${sectionId}"] .sec-body`);
  const holder = document.createElement('div');
  holder.innerHTML = renderEditor(blank, !!parentId);
  sec.appendChild(holder.firstElementChild);
  wire();
  document.getElementById('f-title-new').focus();
}

async function save(id){
  const val = i => document.getElementById(`${i}-${id}`).value.trim();
  const payload = {
    title: val('f-title'),
    detail: val('f-detail') || null,
    owner_id: val('f-owner') || null,
    status: val('f-status'),
    stage: val('f-stage') || null,
    ref_code: val('f-ref') || null,
    sql_objects: (document.getElementById(`f-sql-${id}`).value || '')
      .split('\n').map(s => s.trim()).filter(Boolean),
    due_date: val('f-due') || null,
    is_urgent: document.getElementById(`f-urgent-${id}`).checked,
  };
  if(!payload.title){ toast('Give the item a title first.'); return; }

  if(id === 'new'){
    const sib = state.items.filter(i => i.section_id === state.pending.section_id);
    const { error } = await sb.from('items').insert({ ...payload, ...state.pending,
      created_by: state.me.id, sort_order: sib.length + 1 });
    if(error){ toast(error.message); return; }
  } else {
    // Optimistic concurrency: gate the write on the updated_at we captured
    // when the editor opened. Realtime keeps state.items current while the
    // editor is open, so checking the *current* value would defeat the guard.
    const q = sb.from('items').update(payload).eq('id', +id);
    if(state.editingSince) q.eq('updated_at', state.editingSince);
    const { data, error } = await q.select('id');
    if(error){ toast(error.message); return; }
    if(!data.length){
      toast('Someone else edited this while you had it open. Reloaded — reopen to redo your changes.');
      stopEditing();
      await loadItems(); render();
      return;
    }
  }
  stopEditing();
  await loadItems(); render();
}

/* ═══════════════════════════════════════════════════════════════════
   VIBER EXPORT — rebuilds the pinned message in the format the group
   already reads, so the board and the chat never drift apart.
   ═══════════════════════════════════════════════════════════════════ */
function copyForViber(){
  const d = new Date();
  const L = [];
  L.push(`*${d.toLocaleDateString('en-US',{month:'long',day:'numeric'}).toUpperCase()} DELIVERABLES*`);
  L.push(`_updated as of ${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}_`);

  let mainListUsed = false; // only the first deliverables block goes unheaded
  for(const sec of state.sections){
    const tops = state.items.filter(i => i.section_id === sec.id && !i.parent_id);
    if(!tops.length) continue;
    if(sec.kind !== 'deliverables' || mainListUsed) L.push(`*${sec.label}:*`);
    if(sec.kind === 'deliverables') mainListUsed = true;

    tops.forEach((it, n) => {
      const kids = state.items.filter(c => c.parent_id === it.id);
      const label = it.ref_code && !it.title.includes(it.ref_code) ? `${it.ref_code} - ${it.title}` : it.title;
      const bits = [label];
      if(it.status !== 'nys' || !kids.length) bits.push(STATUS[it.status].viber);
      if(it.stage) bits.push(`in ${it.stage.toUpperCase()}`);
      const owner = state.members.find(m => m.id === it.owner_id);
      if(owner) bits.push(`c/o ${owner.name.split(' ')[0]}`);
      let line = `${n+1}. ${bits.join(' - ')}`;
      if(it.is_urgent) line += ' (URGENT)';
      if(it.status === 'done') line = `~${line}~`;
      else if(kids.length) line = `*${line}*`;
      L.push(line);

      kids.forEach((c, m) => {
        const cLabel = c.ref_code && !c.title.includes(c.ref_code) ? `${c.ref_code} - ${c.title}` : c.title;
        const cb = [`    ${n+1}.${m+1} ${cLabel}`, STATUS[c.status].viber];
        L.push(c.status === 'done' ? `~${cb.join(' - ')}~` : cb.join(' - '));
      });
      if(it.detail) L.push(`_> ${it.detail}_`);
    });
  }

  const dl = state.items.filter(i => i.due_date && i.status !== 'done')
    .sort((a,b) => a.due_date.localeCompare(b.due_date));
  if(dl.length){
    L.push('*DEADLINES:*');
    dl.forEach(i => L.push(`${fmtDate(i.due_date)} - ${i.title}`));
  }
  const tbs = state.items.filter(i => i.status === 'tbs');
  tbs.forEach(i => L.push(`TBS - ${i.title}`));

  const text = L.join('\n');
  navigator.clipboard.writeText(text)
    .then(() => toast('Copied. Paste it into the group and re-pin.'))
    .catch(() => { prompt('Copy this:', text); });
}
</script>
</body>
</html>
