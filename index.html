function copySql(key){
  const [bucket, client] = key.split(':');
  const d = deployData();
  const items = (d[client] || {})[bucket] || [];
  if(!items.length){ toast('Nothing to copy.'); return; }
  const seen = new Set();
  const out = [];
  items.forEach(i => {
    i.sql_objects.forEach(o => {
      const key = o.trim();
      if(key && !seen.has(key)){ seen.add(key); out.push(key); }
    });
  });
  const text = out.join('\n');
  navigator.clipboard.writeText(text)
    .then(() => toast(`Copied ${out.length} object${out.length===1?'':'s'} for ${
      CLIENTS[client]?.label || client}.`))
    .catch(() => { prompt('Copy this:', text); });
}


/* ═══════════════════════════════════════════════════════════════════
   COMPARE — registry of client-program DB objects that are meant to be
   different between the two clients, and so must be excluded when the
   two client databases are schema-compared against each other.

   Standard fixes go to both clients; a client-requested enhancement goes
   to one. Without a durable record of the second kind, every compare run
   reports it as drift and "fixing" it reverts the enhancement.
   ═══════════════════════════════════════════════════════════════════ */
function renderCompare(){
  const keys = CLIENT_KEYS.filter(k =>
    state.filterClient === 'all' || state.filterClient === k);
  const active    = activeDiv();
  const converged = state.divergences.filter(d => d.status !== 'active');
  const shown     = active.filter(d =>
    state.filterClient === 'all' || d.client === state.filterClient);
  const drift     = divDrift().filter(g =>
    state.filterClient === 'all' || g.client === state.filterClient);

  // Counted the way copyExclusions() dedups, so the number on screen and the
  // number of lines on the clipboard agree.
  const uniq = new Set(active.map(d => objKey(d.object_name)).filter(Boolean));

  return `<div class="dash-grid" style="grid-template-columns:1fr">
    <div class="dash-card">
      <h3 class="dash-title" style="display:flex;align-items:center;gap:10px">
        <span style="flex:1">Excluded from SQL compare</span>
        <span class="dash-row-num">${uniq.size} object${uniq.size===1?'':'s'}</span>
      </h3>
      <div class="dash-sub">Objects in the client program databases that are
        meant to differ — skip them when comparing the two client schemas.</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px">
        <button class="btn ghost" id="div-copy">Copy exclusion list (both clients)</button>
        <button class="linkbtn" id="div-new">+ Add exclusion</button>
      </div>
      ${state.filterClient !== 'all' ? `<div class="field-note" style="margin-top:9px">
        Listing ${esc(CLIENTS[state.filterClient]?.label || '')} only. The copy button
        still emits both clients: a compare runs <em>between</em> the two databases
        and takes one ignore list.</div>` : ''}
    </div>

    ${state.editingDiv === 'new' ? renderDivEditor({ id:'new', object_name:'',
        kind:'', status:'active',
        reason:  state.divPrefill?.reason  || '',
        item_id: state.divPrefill?.item_id ?? null,
        client:  state.divPrefill?.client
              || (state.filterClient !== 'all' ? state.filterClient : DEFAULT_CLIENT)
      }) : ''}

    ${drift.length ? `<div class="dash-card">
      <h3 class="dash-title" style="display:flex;align-items:center;gap:10px">
        <span style="flex:1">Origin items with unlisted objects</span>
        <span class="dash-row-num">${drift.length}</span>
      </h3>
      <div class="dash-sub">These enhancements grew after they were recorded.
        The objects below are still being compared.</div>
      ${drift.map(g => `<div class="div-row">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <span style="font-weight:500">${esc(itemLabel(g.item))}</span>
          <span class="tag" style="color:${CLIENTS[g.client]?.tone};border-color:${
            CLIENTS[g.client]?.tone}">${esc(CLIENTS[g.client]?.label || g.client)}</span>
          <span class="div-actions">
            <button class="linkbtn" data-divdrift="${g.item.id}:${g.client}">+ Exclude ${
              g.missing.length} more</button>
          </span>
        </div>
        <div class="detail">${g.missing.map(n => `<code>${esc(n)}</code>`).join(', ')}</div>
      </div>`).join('')}
    </div>` : ''}

    ${keys.map(ck => {
      const rows = shown.filter(d => d.client === ck);
      return `<div class="dash-card">
        <h3 class="dash-title" style="display:flex;align-items:center;gap:10px;color:${CLIENTS[ck].tone}">
          <span style="flex:1">${esc(CLIENTS[ck].label)}</span>
          <span class="dash-row-num">${rows.length}</span>
        </h3>
        <div class="dash-sub">Enhanced for this client — leave the other client's version alone.</div>
        ${rows.length ? rows.map(renderDivRow).join('')
          : `<div class="empty" style="padding:12px 0 0">Nothing excluded for ${esc(CLIENTS[ck].label)}.</div>`}
      </div>`;
    }).join('')}

    ${converged.length ? `<div class="dash-card">
      <h3 class="dash-title" style="display:flex;align-items:center;gap:10px">
        <span style="flex:1">Converged</span>
        <span class="dash-row-num">${converged.length}</span>
        <button class="linkbtn" id="div-showconverged">${state.showConverged?'Hide':'Show'}</button>
      </h3>
      <div class="dash-sub">Back under comparison — the enhancement now exists in both clients.</div>
      ${state.showConverged ? converged.map(renderDivRow).join('') : ''}
    </div>` : ''}
  </div>`;
}

function renderDivRow(d){
  if(state.editingDiv === d.id) return renderDivEditor(d);
  const item = d.item_id ? state.items.find(i => i.id === d.item_id) : null;
  const who  = state.members.find(m => m.id === d.created_by);
  // item_label is a snapshot taken at save time, so the origin stays readable
  // after the item is deleted and the FK has nulled item_id out.
  const origin = item ? itemLabel(item)
               : (d.item_label ? `${d.item_label} (item deleted)` : null);
  const done = d.status !== 'active';

  return `<div class="div-row ${done?'converged':''}">
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
      ${d.kind ? `<span class="tag">${esc(d.kind)}</span>` : ''}
      <span class="div-name">${esc(d.object_name)}</span>
      <span class="div-actions">
        ${done
          ? `<button class="linkbtn" data-divreopen="${d.id}">Reopen</button>`
          : `<button class="linkbtn" data-divedit="${d.id}">Edit</button>
             <button class="linkbtn" data-divconverge="${d.id}">Mark converged</button>`}
      </span>
    </div>
    <div class="detail">${esc(d.reason)}</div>
    <div class="trace">${origin ? `from ${esc(origin)} · ` : ''}${
      esc(who ? who.name.split(' ')[0] : 'someone')} · ${ago(d.created_at)}${
      done && d.converged_at ? ` · converged ${fmtDate(d.converged_at)}` : ''}</div>
  </div>`;
}

/* Uncontrolled like every other editor here: typed values live in the DOM
   until save, and field ids carry the entry id so two open editors can never
   read each other's fields.

   A NEW entry has two modes. Pick an origin item and the object-name and kind
   fields give way to a read-only preview: the save records every object the
   item carries. Leave the item blank and it is the old single-object form, for
   legacy divergences that never had a board item. Editing an existing row is
   always single-object — bulk is a create-time affordance only.

   Both blocks are rendered up front and toggled by wire() with `hidden`,
   because repainting would wipe the reason already typed into the editor. */
function renderDivEditor(d){
  const isNew = d.id === 'new';
  const itemMode = isNew && !!d.item_id;
  const client = d.client || DEFAULT_CLIENT;
  const items = state.items.slice().sort((a,b) =>
    String(a.client).localeCompare(String(b.client)) || a.title.localeCompare(b.title));

  return `<div class="${isNew ? 'dash-card' : 'div-editor'}" data-diveditor="${d.id}">
    <h3 class="dash-title">${isNew ? 'New exclusion' : 'Edit exclusion'}</h3>
    <div class="grid">
      <div class="field wide">
        <label for="d-item-${d.id}">Origin item</label>
        <select id="d-item-${d.id}">
          <option value="">Not from a board item</option>
          ${items.map(i => `<option value="${i.id}" ${i.id===d.item_id?'selected':''}>${
            esc(`[${CLIENTS[i.client]?.label || i.client}] ${itemLabel(i)}`)}</option>`).join('')}
        </select>
        ${isNew ? `<span class="field-note">Picking one excludes every object it carries.</span>` : ''}
      </div>

      ${isNew ? `<div class="field wide" id="d-preview-${d.id}" ${itemMode?'':'hidden'}>
        <label>Will be excluded</label>
        <div id="d-previewlist-${d.id}">${
          itemMode ? divPreviewHtml(d.item_id, client) : ''}</div>
      </div>` : ''}

      <div class="field wide" id="d-objectwrap-${d.id}" ${itemMode?'hidden':''}>
        <label for="d-object-${d.id}">Object name</label>
        <input id="d-object-${d.id}" value="${esc(d.object_name||'')}"
               placeholder="dbo.sp_compute_charges">
        <span class="field-note">Spell it the way your compare tool names it — schema-qualified travels best.</span>
      </div>
      <div class="field" id="d-kindwrap-${d.id}" ${itemMode?'hidden':''}>
        <label for="d-kind-${d.id}">Type</label>
        <select id="d-kind-${d.id}">
          <option value="">—</option>
          ${SQL_KINDS.map(k => `<option value="${k}" ${k===(d.kind||'')?'selected':''}>${k}</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <label for="d-client-${d.id}">Enhanced for</label>
        <select id="d-client-${d.id}">
          ${CLIENT_KEYS.map(k => `<option value="${k}" ${
            k === client ? 'selected' : ''
          }>${esc(CLIENTS[k].label)}</option>`).join('')}
        </select>
      </div>
      <div class="field wide">
        <label for="d-reason-${d.id}">Why it differs *</label>
        <textarea id="d-reason-${d.id}"
          placeholder="RCD Land asked for per-project VAT splitting; HTLand keeps the standard computation.">${esc(d.reason||'')}</textarea>
      </div>
    </div>
    <div class="ed-actions">
      <button class="btn" data-divsave="${d.id}">${isNew?'Add exclusions':'Save changes'}</button>
      <button class="btn ghost" data-divcancel="1">Cancel</button>
      ${isNew ? '' : `<button class="del" data-divdel="${d.id}">Delete</button>`}
    </div>
  </div>`;
}

async function saveDivergence(id){
  const g = n => document.getElementById(`d-${n}-${id}`);
  const reason = g('reason').value.trim();
  const client = g('client').value || DEFAULT_CLIENT;
  const itemId = g('item').value ? +g('item').value : null;
  const item   = itemId ? state.items.find(i => i.id === itemId) : null;

  if(!reason){ toast('Say why it differs — that record is the point of the entry.'); return; }

  /* Item mode. Branch on the item, never on the object-name field: that field
     is hidden here and may still hold whatever was typed before the item was
     picked. */
  if(id === 'new' && item){
    const distinct = new Set((item.sql_objects || [])
      .map(o => bareName(o)).filter(Boolean));
    if(!distinct.size){ toast('That item carries no deployment objects.'); return; }
    const rows = divRowsForItem(item, client, reason);
    if(!rows.length){
      toast(`Every object on that item is already excluded for ${
        CLIENTS[client]?.label || client}.`);
      return;
    }
    const { error } = await sb.from('divergences')
      .insert(rows.map(r => ({ ...r, created_by: state.me.id })));
    if(error){ toast(error.message); return; }
    const skipped = distinct.size - rows.length;
    state.editingDiv = null; state.divPrefill = null;
    await loadDivergences(); render();
    toast(`Excluded ${rows.length} object${rows.length===1?'':'s'}${
      skipped ? ` (${skipped} already listed)` : ''}.`);
    return;
  }

  const raw = g('object').value.trim();
  // A pasted PROC:sp_foo splits into kind + name, so the registry stores one
  // spelling regardless of which convention it was copied from.
  const typedKind = (raw.match(/^([A-Za-z]+):/) || [])[1];
  const object_name = raw.replace(/^[A-Za-z]+:/, '').trim();
  if(!object_name){ toast('Name the object first.'); return; }

  const payload = {
    object_name,
    kind: (typedKind ? typedKind.toUpperCase() : g('kind').value) || null,
    client,
    reason,
    item_id: itemId,
    // Snapshot: item_id is nulled out when the item is deleted, and the origin
    // still has to be readable afterwards.
    item_label: item ? itemLabel(item) : null,
  };

  const { error } = id === 'new'
    ? await sb.from('divergences').insert({ ...payload, created_by: state.me.id })
    : await sb.from('divergences').update(payload).eq('id', +id);

  // 23505 = the partial unique index on (client, lower(object_name)).
  if(error){
    toast(error.code === '23505'
      ? `${object_name} is already excluded for ${
          CLIENTS[client]?.label || client}.`
      : error.message);
    return;
  }
  state.editingDiv = null; state.divPrefill = null;
  await loadDivergences(); render();
}

/* The exclusion list itself. Plain names, one per line, deduped and sorted.

   This ignores state.filterClient and always emits both clients — the same
   call copyForViber() makes, and the opposite of deployData()'s per-client
   split. A push list is per client; an ignore list is not. The compare runs
   *between* the two databases, so it takes one list, and a filtered copy
   would quietly hand back half of it. */
function copyExclusions(){
  const seen = new Set();
  const out  = [];
  activeDiv().forEach(d => {
    const k = objKey(d.object_name);
    if(k && !seen.has(k)){ seen.add(k); out.push(d.object_name.trim()); }
  });
  if(!out.length){ toast('Nothing is excluded yet.'); return; }
  out.sort((a,b) => a.localeCompare(b));
  const text = out.join('\n');
  navigator.clipboard.writeText(text)
    .then(() => toast(`Copied ${out.length} object${out.length===1?'':'s'} to exclude.`))
    .catch(() => { prompt('Copy this:', text); });
}

/* ═══════════════════════════════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════════════════════════════ */
function wire(){
  document.getElementById('signout').onclick = () => sb.auth.signOut();

  // Tab switch discards any open editor — treated as abandoning the edit.
  root.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    state.view = b.dataset.view;
    stopEditing();
    state.editingSection = null;
    state.editingMember = null;
    state.editingDiv = null;
    state.divPrefill = null;
    state.confirmingDelete = null;
    render();
  });

  // Qualified selector on purpose: data-s is already taken by the status stamp,
  // and a bare [data-c] would be that same trap waiting to be sprung.
  root.querySelectorAll('.chip[data-c]').forEach(b => b.onclick = () => {
    state.filterClient = b.dataset.c;
    if(state.filterClient === 'all') state.showAllSections = false;
    render(); });

  root.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    state.filterOwner = b.dataset.o; render(); });
  root.querySelectorAll('.chip[data-s]').forEach(b => b.onclick = () => {
    state.filterStatus = state.filterStatus === b.dataset.s ? 'all' : b.dataset.s; render(); });

  const q = document.getElementById('q');
  if(q){
    q.oninput = () => { state.q = q.value; render();
      const n = document.getElementById('q'); n.focus();
      n.setSelectionRange(n.value.length, n.value.length); };
  }

  document.getElementById('viber').onclick = copyForViber;

  document.getElementById('team').onclick = () => {
    state.showTeam = !state.showTeam; state.editingMember = null; render(); };

  const tClose = document.getElementById('team-close');
  if(tClose) tClose.onclick = () => {
    state.showTeam = false; state.editingMember = null; render(); };

  const mNew = document.getElementById('mem-new');
  if(mNew) mNew.onclick = () => {
    state.editingMember = 'new'; render(); document.getElementById('m-name').focus(); };

  root.querySelectorAll('[data-memedit]').forEach(b => b.onclick = () => {
    state.editingMember = b.dataset.memedit; render(); });

  root.querySelectorAll('[data-memcancel]').forEach(b => b.onclick = () => {
    state.editingMember = null; render(); });

  root.querySelectorAll('[data-memsave]').forEach(b => b.onclick = async () => {
    const id = b.dataset.memsave;
    const name = document.getElementById('m-name').value.trim();
    if(!name){ toast('Give the member a name first.'); return; }
    let initials = document.getElementById('m-initials').value.trim().toUpperCase();
    if(!initials) initials = name.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
    const email = document.getElementById('m-email').value.trim() || null;

    const { error } = id === 'new'
      ? await sb.from('members').insert({ name, initials, email })
      : await sb.from('members').update({ name, initials, email }).eq('id', id);
    if(error){ toast(error.message); return; }
    state.editingMember = null;
    await loadMembers(); render();
  });

  root.querySelectorAll('[data-memdel]').forEach(b => b.onclick = async () => {
    const m = state.members.find(x => x.id === b.dataset.memdel);
    const load = state.items.filter(i => i.owner_id === m.id).length;
    if(!confirm(load
      ? `Remove ${m.name}? Their ${load} assigned item${load===1?'':'s'} stay on the board but become unassigned.`
      : `Remove ${m.name}?`)) return;
    const { error } = await sb.from('members').delete().eq('id', m.id);
    if(error){ toast(error.message); return; }
    state.editingMember = null;
    await loadMembers(); await loadItems(); render();
  });

  root.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const id = +b.dataset.toggle;
    state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
    render();
  });

  /* ── section management ────────────────────────────────────────── */
  root.querySelectorAll('[data-secedit]').forEach(b => b.onclick = () => {
    const id = +b.dataset.secedit;
    state.editingSection = state.editingSection === id ? null : id;
    state.confirmingDelete = null;
    render();
  });

  root.querySelectorAll('[data-seccancel]').forEach(b => b.onclick = () => {
    state.editingSection = null; state.confirmingDelete = null; render(); });

  root.querySelectorAll('[data-secsave]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.secsave;
    const label = document.getElementById('s-label').value.trim();
    if(!label){ toast('Give the section a name first.'); return; }
    const { error } = await sb.from('sections')
      .update({ label, kind: document.getElementById('s-kind').value }).eq('id', id);
    if(error){ toast(error.message); return; }
    state.editingSection = null;
    await loadSections(); render();
  });

  const secShowAll = document.getElementById('sec-showall');
  if(secShowAll) secShowAll.onclick = () => {
    state.showAllSections = !state.showAllSections; render(); };

  const nOpen = document.getElementById('n-open');
  if(nOpen) nOpen.onclick = () => {
    state.editingSection = 'new'; state.confirmingDelete = null; render();
    document.getElementById('n-label').focus();
  };

  const nSave = document.getElementById('n-save');
  if(nSave) nSave.onclick = async () => {
    const label = document.getElementById('n-label').value.trim();
    if(!label){ toast('Give the section a name first.'); return; }
    let key = slug(label);
    const taken = new Set(state.sections.map(s => s.key));
    if(taken.has(key)){ let n = 2; while(taken.has(`${key}-${n}`)) n++; key = `${key}-${n}`; }
    const { error } = await sb.from('sections').insert({
      key, label,
      kind: document.getElementById('n-kind').value,
      sort_order: state.sections.length + 1,
    });
    if(error){ toast(error.message); return; }
    state.editingSection = null;
    await loadSections(); render();
  };

  root.querySelectorAll('[data-up],[data-down]').forEach(b => b.onclick = async () => {
    const id = +(b.dataset.up || b.dataset.down);
    const dir = b.dataset.up ? -1 : 1;
    const i = state.sections.findIndex(s => s.id === id);
    const j = i + dir;
    if(j < 0 || j >= state.sections.length) return;
    const a = state.sections[i], c = state.sections[j];
    await Promise.all([
      sb.from('sections').update({ sort_order: c.sort_order }).eq('id', a.id),
      sb.from('sections').update({ sort_order: a.sort_order }).eq('id', c.id),
    ]);
    await loadSections(); render();
  });

  root.querySelectorAll('[data-secdel]').forEach(b => b.onclick = () => {
    state.confirmingDelete = +b.dataset.secdel; render(); });

  root.querySelectorAll('[data-secdelno]').forEach(b => b.onclick = () => {
    state.confirmingDelete = null; render(); });

  root.querySelectorAll('[data-secmove]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.secmove;
    const to = +document.getElementById('s-moveto').value;
    const { error: mErr } = await sb.from('items')
      .update({ section_id: to }).eq('section_id', id);
    if(mErr){ toast(mErr.message); return; }
    const { error } = await sb.from('sections').delete().eq('id', id);
    if(error){ toast(error.message); return; }
    state.editingSection = null; state.confirmingDelete = null;
    await loadSections(); await loadItems(); render();
    toast('Items moved, section deleted.');
  });

  root.querySelectorAll('[data-secdelgo]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.secdelgo;
    const { error } = await sb.from('sections').delete().eq('id', id);
    if(error){ toast(error.message); return; }
    state.editingSection = null; state.confirmingDelete = null;
    await loadSections(); await loadItems(); render();
    toast('Section deleted.');
  });

  root.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
    const it = state.items.find(i => i.id === +b.dataset.done);
    const { error } = await sb.from('items').update({ status: it.status === 'done' ? 'nys' : 'done' })
      .eq('id', it.id);
    if(error){ toast(error.message); return; }
    await loadItems(); render();
  });

  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const id = +b.dataset.edit;
    const it = state.items.find(i => i.id === id);
    state.editing = id;
    state.editingSince = it ? it.updated_at : null;
    render();
  });

  root.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    state.pending = { section_id:+b.dataset.add, parent_id:null };
    state.editing = 'new'; renderNewInto(+b.dataset.add, null); });

  root.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => {
    const p = state.items.find(i => i.id === +b.dataset.sub);
    state.pending = { section_id:p.section_id, parent_id:p.id };
    state.editing = 'new'; renderNewInto(p.section_id, p.id); });

  root.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    stopEditing(); render(); });

  root.querySelectorAll('[data-save]').forEach(b => b.onclick = () => save(b.dataset.save));

  root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Delete this item and any sub-items?')) return;
    const { error } = await sb.from('items').delete().eq('id', +b.dataset.del);
    if(error){ toast(error.message); return; }
    stopEditing(); await loadItems(); render();
  });

  root.querySelectorAll('[data-copysql]').forEach(b => b.onclick = () => copySql(b.dataset.copysql));

  /* ── compare / divergence registry ─────────────────────────────── */
  const divCopy = document.getElementById('div-copy');
  if(divCopy) divCopy.onclick = copyExclusions;

  const divNew = document.getElementById('div-new');
  if(divNew) divNew.onclick = () => {
    state.editingDiv = 'new'; state.divPrefill = null; render();
    document.getElementById('d-object-new').focus(); };

  const divShow = document.getElementById('div-showconverged');
  if(divShow) divShow.onclick = () => {
    state.showConverged = !state.showConverged; render(); };

  root.querySelectorAll('[data-divedit]').forEach(b => b.onclick = () => {
    state.editingDiv = +b.dataset.divedit; render(); });

  root.querySelectorAll('[data-divcancel]').forEach(b => b.onclick = () => {
    state.editingDiv = null; state.divPrefill = null; render(); });

  root.querySelectorAll('[data-divsave]').forEach(b => b.onclick = () =>
    saveDivergence(b.dataset.divsave));

  root.querySelectorAll('[data-divdel]').forEach(b => b.onclick = async () => {
    if(!confirm('Delete this exclusion? The object goes back into the compare.')) return;
    const { error } = await sb.from('divergences').delete().eq('id', +b.dataset.divdel);
    if(error){ toast(error.message); return; }
    state.editingDiv = null; state.divPrefill = null;
    await loadDivergences(); render();
  });

  root.querySelectorAll('[data-divconverge]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('divergences')
      .update({ status:'converged', converged_at: today() })
      .eq('id', +b.dataset.divconverge);
    if(error){ toast(error.message); return; }
    await loadDivergences(); render();
    toast('Converged — that object is back under comparison.');
  });

  root.querySelectorAll('[data-divreopen]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('divergences')
      .update({ status:'active', converged_at:null }).eq('id', +b.dataset.divreopen);
    // The partial unique index bites here if the object was excluded again in
    // the meantime. Say so rather than letting the write look like it worked.
    if(error){
      toast(error.code === '23505'
        ? 'That object already has an active exclusion.' : error.message);
      return;
    }
    await loadDivergences(); render();
  });

  /* Mode switch and preview happen in the DOM, not through render():
     repainting would wipe the reason already typed into the open editor. */
  root.querySelectorAll('[data-diveditor]').forEach(ed => {
    const id        = ed.dataset.diveditor;
    const itemSel   = document.getElementById(`d-item-${id}`);
    const clientSel = document.getElementById(`d-client-${id}`);
    const preview   = document.getElementById(`d-preview-${id}`);
    const objWrap   = document.getElementById(`d-objectwrap-${id}`);
    const kindWrap  = document.getElementById(`d-kindwrap-${id}`);
    if(!itemSel) return;
    // No preview block on an existing row — bulk is create-only.
    const sync = () => {
      if(!preview) return;
      const itemMode = !!itemSel.value;
      preview.hidden = !itemMode;
      objWrap.hidden = itemMode;
      kindWrap.hidden = itemMode;
      if(itemMode) document.getElementById(`d-previewlist-${id}`).innerHTML =
        divPreviewHtml(itemSel.value, clientSel.value);
    };
    itemSel.onchange = () => {
      const it = itemSel.value ? state.items.find(i => i.id === +itemSel.value) : null;
      if(it) clientSel.value = it.client;
      sync();
    };
    // Which objects read as "already excluded" depends on the client.
    clientSel.onchange = sync;
  });

  root.querySelectorAll('[data-divdrift]').forEach(b => b.onclick = () => {
    const [itemId, client] = b.dataset.divdrift.split(':');
    const g = divDrift().find(x => x.item.id === +itemId && x.client === client);
    /* Prefills the editor rather than inserting outright: the bulk save
       already skips what is listed, so routing through it avoids a second
       insert path and keeps `reason` required. */
    state.divPrefill = { item_id:+itemId, client, reason: g ? g.reason : '' };
    state.editingDiv = 'new';
    render();
  });
}

function renderNewInto(sectionId, parentId){
  const parent = parentId ? state.items.find(i => i.id === parentId) : null;
  const blank = { id:'new', title:'', detail:'', owner_id:state.me.id,
                  status:'nys', stage:null, ref_code:'', sql_objects:[],
                  // A sub-item takes its parent's client. A new top-level item
                  // takes whichever client you're filtered to, so adding while
                  // scoped to RCD Land doesn't quietly file it under HTLand.
                  client: parent ? parent.client
                        : (state.filterClient !== 'all' ? state.filterClient : DEFAULT_CLIENT),
                  due_date:null, is_urgent:false, parent_id:parentId };
  render();
  const section = state.sections.find(s => s.id === sectionId);
  const body = root.querySelector(`.section[data-id="${sectionId}"] .sec-body`);
  const holder = document.createElement('div');
  holder.innerHTML = renderEditor(blank, !!parentId, section);
  body.appendChild(holder.firstElementChild);
  wire();
  document.getElementById('f-title-new').focus();
}

async function save(id){
  const val = i => document.getElementById(`${i}-${id}`).value.trim();

  // Resolved ahead of the payload because the client depends on them: a
  // sub-item inherits its parent's client rather than reading the disabled
  // select. A trigger enforces the same rule server-side — this only keeps the
  // optimistic write in step with what Postgres will store.
  const sectionId = id === 'new'
    ? state.pending.section_id
    : state.items.find(i => i.id === +id)?.section_id;
  const parentId = id === 'new'
    ? state.pending.parent_id
    : state.items.find(i => i.id === +id)?.parent_id;
  const sec = state.sections.find(s => s.id === sectionId);

  const payload = {
    title: val('f-title'),
    detail: val('f-detail') || null,
    owner_id: val('f-owner') || null,
    status: val('f-status'),
    stage: val('f-stage') || null,
    client: parentId
      ? (state.items.find(i => i.id === parentId)?.client || DEFAULT_CLIENT)
      : (val('f-client') || DEFAULT_CLIENT),
    ref_code: val('f-ref') || null,
    sql_objects: (document.getElementById(`f-sql-${id}`).value || '')
      .split('\n').map(s => s.trim()).filter(Boolean),
    due_date: val('f-due') || null,
    is_urgent: document.getElementById(`f-urgent-${id}`).checked,
  };
  if(!payload.title){ toast('Give the item a title first.'); return; }
  if(sec?.kind === 'issue_logs' && !parentId && !payload.ref_code){
    toast('Give the item a ref / issue no. first.'); return;
  }

  if(id === 'new'){
    const sib = state.items.filter(i => i.section_id === state.pending.section_id);
    const { error } = await sb.from('items').insert({ ...payload, ...state.pending,
      created_by: state.me.id, sort_order: sib.length + 1 });
    if(error){ toast(error.message); return; }
  } else {
    // Optimistic concurrency: gate the write on the updated_at we captured
    // when the editor opened. Realtime keeps state.items current while the
    // editor is open, so checking the *current* value would defeat the guard.
    const q = sb.from('items').update(payload).eq('id', +id);
    if(state.editingSince) q.eq('updated_at', state.editingSince);
    const { data, error } = await q.select('id');
    if(error){ toast(error.message); return; }
    if(!data.length){
      toast('Someone else edited this while you had it open. Reloaded — reopen to redo your changes.');
      stopEditing();
      await loadItems(); render();
      return;
    }
  }
  stopEditing();
  await loadItems(); render();
}

/* ═══════════════════════════════════════════════════════════════════
   VIBER EXPORT — rebuilds the pinned message in the format the group
   already reads, so the board and the chat never drift apart.
   ═══════════════════════════════════════════════════════════════════ */
function copyForViber(){
  const d = new Date();
  const L = [];
  L.push(`*${d.toLocaleDateString('en-US',{month:'long',day:'numeric'}).toUpperCase()} DELIVERABLES*`);
  L.push(`_updated as of ${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}_`);

  // One block per client, HTLand first (CLIENT_KEYS order). This deliberately
  // ignores state.filterClient — the export regenerates the pinned message,
  // which has to be complete regardless of how the board is scoped.
  for(const ck of CLIENT_KEYS){
    const mine = state.items.filter(i => i.client === ck);
    if(!mine.length) continue;   // no heading for a client with nothing on it
    L.push('');
    L.push(`*${CLIENTS[ck].viber}*`);

    // Scoped inside the client loop on purpose: each client's first
    // deliverables block is its own unheaded main list. Hoisting this out
    // would print RCD Land's list headed while HTLand's went unheaded.
    let mainListUsed = false;
    for(const sec of state.sections){
      const tops = mine.filter(i => i.section_id === sec.id && !i.parent_id);
      if(!tops.length) continue;
      if(sec.kind !== 'deliverables' || mainListUsed) L.push(`*${sec.label}:*`);
      if(sec.kind === 'deliverables') mainListUsed = true;

      tops.forEach((it, n) => {
        const kids = mine.filter(c => c.parent_id === it.id);
        const label = it.ref_code && !it.title.includes(it.ref_code) ? `${it.ref_code} - ${it.title}` : it.title;
        const bits = [label];
        if(it.status !== 'nys' || !kids.length) bits.push(STATUS[it.status].viber);
        if(it.stage) bits.push(`in ${it.stage.toUpperCase()}`);
        const owner = state.members.find(m => m.id === it.owner_id);
        if(owner) bits.push(`c/o ${owner.name.split(' ')[0]}`);
        let line = `${n+1}. ${bits.join(' - ')}`;
        if(it.is_urgent) line += ' (URGENT)';
        if(it.status === 'done') line = `~${line}~`;
        else if(kids.length) line = `*${line}*`;
        L.push(line);

        kids.forEach((c, m) => {
          const cLabel = c.ref_code && !c.title.includes(c.ref_code) ? `${c.ref_code} - ${c.title}` : c.title;
          const cb = [`    ${n+1}.${m+1} ${cLabel}`, STATUS[c.status].viber];
          L.push(c.status === 'done' ? `~${cb.join(' - ')}~` : cb.join(' - '));
        });
        if(it.detail) L.push(`_> ${it.detail}_`);
      });
    }

    // Trailers stay inside the block so either client's half can be posted
    // on its own without dragging the other's deadlines along.
    const dl = mine.filter(i => i.due_date && i.status !== 'done')
      .sort((a,b) => a.due_date.localeCompare(b.due_date));
    if(dl.length){
      L.push('*DEADLINES:*');
      dl.forEach(i => L.push(`${fmtDate(i.due_date)} - ${i.title}`));
    }
    const tbs = mine.filter(i => i.status === 'tbs');
    tbs.forEach(i => L.push(`TBS - ${i.title}`));
  }

  const text = L.join('\n');
  navigator.clipboard.writeText(text)
    .then(() => toast('Copied. Paste it into the group and re-pin.'))
    .catch(() => { prompt('Copy this:', text); });
}
</script>
